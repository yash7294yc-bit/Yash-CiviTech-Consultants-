name: Build Signed Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          rm -rf build-src
          unzip -q YashCiviTechConsultants-Release-Ready.zip -d build-src

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 secret is missing" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yashcivitech-release.jks"
          test -s "$RUNNER_TEMP/yashcivitech-release.jks"

      - name: Build signed release APK and App Bundle
        working-directory: build-src/YashCiviTechConsultants
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/yashcivitech-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD secret is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD secret is missing" && exit 1)
          gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YashCiviTechConsultants-release
          path: |
            build-src/YashCiviTechConsultants/app/build/outputs/apk/release/*.apk
            build-src/YashCiviTechConsultants/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
