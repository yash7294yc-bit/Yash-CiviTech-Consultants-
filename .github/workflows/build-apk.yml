name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          unzip -q YashCiviTechConsultants-APK-Ready.zip -d build-src

      - name: Build APK
        working-directory: build-src/YashCiviTechConsultants
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YashCiviTechConsultants-debug-apk
          path: build-src/YashCiviTechConsultants/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
