name: Build Yash CiviTech V2.0.3 Release

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check V2.0.3 ZIP
        run: |
          test -f YashCiviTechConsultants-V2.0.3-Fixed.zip
          unzip -tq YashCiviTechConsultants-V2.0.3-Fixed.zip

      - name: Extract V2.0.3 project
        run: |
          rm -rf build-src
          unzip -q YashCiviTechConsultants-V2.0.3-Fixed.zip -d build-src
          test -f build-src/YashCiviTechConsultants/settings.gradle.kts
          test -f build-src/YashCiviTechConsultants/app/src/main/assets/content.json
          grep -q 'versionCode = 5' build-src/YashCiviTechConsultants/app/build.gradle.kts
          grep -q 'versionName = "2.0.3"' build-src/YashCiviTechConsultants/app/build.gradle.kts
          echo "V2.0.3 project verified."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yashcivitech-release.jks"
          test -s "$RUNNER_TEMP/yashcivitech-release.jks"

      - name: Build signed V2.0.3 APK and AAB
        working-directory: build-src/YashCiviTechConsultants
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/yashcivitech-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload V2.0.3 release
        uses: actions/upload-artifact@v4
        with:
          name: YashCiviTechConsultants-V2.0.3-release
          path: |
            build-src/YashCiviTechConsultants/app/build/outputs/apk/release/*.apk
            build-src/YashCiviTechConsultants/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
